# vhost لـ nginx المضيف (متوافق مع nginx 1.18 على Ubuntu 22.04).
# الترتيب الصحيح (الشهادات في هذا الخادم تُجدَّد بـ authenticator = nginx):
#  1) vhost مؤقت على المنفذ 80 فقط:
#       printf 'server {\n listen 80;\n server_name chat.alazab.com;\n location / { return 404; }\n}\n' \
#         > /etc/nginx/sites-available/chat.alazab.com
#       ln -s ../sites-available/chat.alazab.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#  2) certbot certonly --nginx -d chat.alazab.com
#  3) استبدل الملف بهذا الـ vhost الكامل ثم: nginx -t && systemctl reload nginx
# الأسماء الفريدة ($alazab_*) كي لا تتعارض مع conf.d/00-websocket-map.conf وغيره.
map $http_upgrade $alazab_conn_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name chat.alazab.com;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.alazab.com;

    ssl_certificate     /etc/letsencrypt/live/chat.alazab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.alazab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AlazabChatSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    # لوحة الإدارة — إن كانت لا تدعم مسارًا فرعيًا استخدم نطاقًا فرعيًا مستقلًا.
    location /admin/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alazab_conn_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alazab_conn_upgrade;

        # بث الردود (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
