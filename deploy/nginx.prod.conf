# =============================================================================
# Alazab Production Nginx Configuration (https://chat.alazab.com)
# منظومة العزب للذكاء الاصطناعي — إعدادات الخادم العكسي، الحماية، والأداء العالي
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. سياسات الحد من تدفق الطلبات (Rate Limiting Zones)
# حماية نقاط المصادقة من هجمات التخمين والقوة العمياء (Brute-Force)
limit_req_zone $binary_remote_addr zone=alazab_auth_limit:10m rate=5r/m;
# حماية واجهات الـ API العامة من الإغراق والـ DoS
limit_req_zone $binary_remote_addr zone=alazab_api_limit:10m rate=30r/s;

# 2. خادم HTTP (التحويل التلقائي الإلزامي إلى HTTPS والتحقق من الشهادات)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name chat.alazab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. خادم HTTPS المشفر (Production SSL/TLS & Reverse Proxy)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.alazab.com;

    # شهادات Let's Encrypt الرسمية
    ssl_certificate     /etc/letsencrypt/live/chat.alazab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.alazab.com/privkey.pem;

    # أحدث بروتوكولات الأمان (TLS 1.2 و TLS 1.3 فقط مع حظر الإصدارات القديمة)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AlazabSSL:10m;
    ssl_session_tickets off;

    # هيدرز الأمان العالي (Enterprise Security Headers)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # الحد الأقصى لحجم رفع الملفات والوثائق (مطابق لـ fileConfig في librechat.yaml)
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=30s;
    set $api_upstream   http://api:3080;
    set $admin_upstream http://admin-panel:3000;

    # فحص الجاهزية والخدمة (Health Check Endpoint)
    location /health {
        proxy_pass $api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # حماية نقاط تسجيل الدخول واستعادة كلمة المرور بمحدد معدل صارم
    location ~* ^/api/auth/(login|reset-password|request-password-reset) {
        limit_req zone=alazab_auth_limit burst=10 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # لوحة الإدارة المركزية على المسار /admin/
    location /admin/ {
        limit_req zone=alazab_api_limit burst=20 nodelay;
        proxy_pass $admin_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # البوابة الرئيسية والدردشة المباشرة (LibreChat API & UI)
    location / {
        limit_req zone=alazab_api_limit burst=50 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # دعم البث اللحظي للردود (Server-Sent Events / SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
