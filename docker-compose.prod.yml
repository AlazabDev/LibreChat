# =============================================================================
# Alazab — production compose (VPS / single host)
# الاستخدام:
#   cp .env.alazab.example .env && cp librechat.alazab.yaml librechat.yaml
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# يتطلب متغيرات: IMAGE_TAG, MONGO_USER, MONGO_PASSWORD, POSTGRES_*, MEILI_MASTER_KEY
# (انظر .env.alazab.example). لا تستخدم :latest في الإنتاج.
# =============================================================================
name: alazab-librechat

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  api:
    image: ${LIBRECHAT_IMAGE:-ghcr.io/alazabdev/librechat}:${IMAGE_TAG:?set IMAGE_TAG in .env}
    container_name: LibreChat-API
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
      meilisearch: { condition: service_started }
      rag_api: { condition: service_started }
    env_file: [.env]
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      # كلمة المرور يجب أن تكون hex/alnum كي لا تحتاج URL-encoding
      MONGO_URI: mongodb://${MONGO_USER:?}:${MONGO_PASSWORD:?}@mongodb:27017/LibreChat?authSource=admin
      MEILI_HOST: http://meilisearch:7700
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}
      CONFIG_PATH: /app/librechat.yaml
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
    expose: ["3080"]            # داخلي فقط، يصل إليه nginx
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./skill:/app/skill
      - librechat-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [internal]
    logging: *logging

  admin-panel:
    image: registry.librechat.ai/librechat-ai/librechat-admin-panel:${ADMIN_PANEL_IMAGE_TAG:-latest}
    container_name: admin-panel
    restart: unless-stopped
    depends_on: [api]
    environment:
      PORT: 3000
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET:?}
      API_SERVER_URL: http://api:3080
      VITE_API_BASE_URL: ${DOMAIN_CLIENT:?}
      SESSION_COOKIE_SECURE: "true"
    expose: ["3000"]
    networks: [internal]
    logging: *logging

  nginx:
    image: nginx:1.27.0-alpine
    container_name: LibreChat-NGINX
    restart: unless-stopped
    depends_on: [api, admin-panel]
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro        # شهادات certbot على المضيف
      - ./deploy/certbot-webroot:/var/www/certbot:ro
    networks: [internal]
    logging: *logging

  mongodb:
    image: mongo:8.0.20
    container_name: chat-mongodb
    restart: unless-stopped
    # المصادقة مفعّلة (لا --noauth). المستخدم يُنشأ عند أول تشغيل على data-node فارغ.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - ./data-node:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [internal]
    logging: *logging

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: chat-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?}
    volumes:
      - ./meili_data_v1.35.1:/meili_data
    networks: [internal]
    logging: *logging

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    container_name: vectordb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]
    logging: *logging

  rag_api:
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:${RAG_IMAGE_TAG:-latest}
    container_name: rag_api
    restart: unless-stopped
    depends_on:
      vectordb: { condition: service_healthy }
    env_file: [.env]
    environment:
      DB_HOST: vectordb
      RAG_PORT: ${RAG_PORT:-8000}
    networks: [internal]
    logging: *logging

networks:
  internal:
    driver: bridge

volumes:
  pgdata2:
  librechat-data:
